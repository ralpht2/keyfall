<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15131b">
<title>Keyfall — piano trainer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2315131b'/%3E%3Crect x='7' y='5' width='6' height='13' rx='2' fill='%23f2b544'/%3E%3Crect x='17' y='9' width='6' height='9' rx='2' fill='%2346b6cf'/%3E%3Crect x='4' y='20' width='24' height='3' fill='%23a3243a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --lacquer:#15131b; --panel:#1d1a24; --panel2:#24202d; --line:#332e3e;
  --ivory:#f2ede1; --text:#ece6da; --muted:#9a93a6;
  --felt:#a3243a; --brass:#d9b36c; --rh:#f2b544; --lh:#46b6cf; --bad:#ff5f5f;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Instrument Serif",Georgia,"Times New Roman",serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--lacquer);color:var(--text);font:14px/1.4 var(--sans);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;white-space:nowrap}
.top::-webkit-scrollbar,.trans::-webkit-scrollbar{display:none}
.song{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border-radius:8px;min-width:0;max-width:340px;flex-shrink:1}
.song:hover{background:var(--panel2)}
.song svg{flex-shrink:0;color:var(--brass)}
.song-t{font:400 23px/1.1 var(--serif);overflow:hidden;text-overflow:ellipsis;letter-spacing:.2px}
.ctrls{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.seg{display:flex;background:var(--lacquer);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{padding:5px 10px;border-radius:7px;color:var(--muted);font-weight:500}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
#segHands button[data-v="L"].on{color:var(--lh)}
#segHands button[data-v="R"].on{color:var(--rh)}
select{background:var(--lacquer);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-weight:500}
.speed{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;background:var(--lacquer)}
.speed button{padding:5px 9px;font-weight:600}
.speed #spdVal{min-width:54px;font-variant-numeric:tabular-nums;color:var(--brass)}
.ico{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted);flex-shrink:0}
.ico:hover{background:var(--panel2);color:var(--text)}
.pill{display:flex;align-items:center;gap:7px;padding:5px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#5a5466}
.pill.live{color:var(--text)} .pill.live .dot{background:#5fd38a;box-shadow:0 0 8px #5fd38a}

/* ---------- transport ---------- */
.trans{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;overflow-x:auto;scrollbar-width:none}
.tbtn{display:flex;align-items:center;gap:5px;height:36px;padding:0 10px;border-radius:8px;color:var(--text);font-size:13px;font-weight:500;flex-shrink:0}
.tbtn:hover{background:var(--panel2)}
.tbtn svg{opacity:.9}
.play{width:46px;height:38px;border-radius:10px;background:var(--brass);color:#1b1610;display:grid;place-items:center;flex-shrink:0;margin:0 4px}
.play:hover{filter:brightness(1.08)}
.tl{position:relative;flex:1;min-width:120px;height:36px;cursor:pointer;touch-action:none;margin:0 8px}
.tl-track{position:absolute;left:0;right:0;top:15px;height:6px;border-radius:3px;background:var(--lacquer);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.tl-fill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#7d1b2c,var(--felt))}
.tl-loop{position:absolute;top:0;bottom:0;background:rgba(217,179,108,.35);display:none}
.tl-head{position:absolute;top:10px;width:4px;height:16px;margin-left:-2px;border-radius:2px;background:var(--ivory);box-shadow:0 0 0 2px var(--lacquer)}
.barinfo{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:78px;text-align:right;flex-shrink:0}
.tbtn.loop.on{background:rgba(217,179,108,.16);color:var(--brass)}

/* ---------- stage ---------- */
.stage{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(29,26,36,.96);border:1px solid var(--line);
  padding:8px 14px;border-radius:10px;font-size:13px;max-width:min(560px,90%);white-space:normal;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;background:rgba(8,7,11,.66);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;
  box-shadow:0 24px 60px rgba(0,0,0,.5);user-select:text;-webkit-user-select:text}
.sheet.small{width:min(440px,100%)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 10px}
.sheet-h h2{font:400 28px/1.1 var(--serif);flex:1}
.sheet-b{overflow-y:auto;padding:4px 18px 18px;-webkit-overflow-scrolling:touch}
.x{width:34px;height:34px;border-radius:8px;color:var(--muted);font-size:18px}
.x:hover{background:var(--panel2);color:var(--text)}
.sheet section{padding:12px 0;border-top:1px solid var(--line)}
.sheet section:first-child{border-top:0}
.sheet h3{font-size:15px;font-weight:600;margin-bottom:8px;color:var(--text)}
.sheet p{color:var(--muted);max-width:66ch;margin-bottom:8px}
.sheet p b{color:var(--text);font-weight:600}
.btn{padding:9px 14px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:600}
.btn:hover{border-color:#4a4357}
.btn.primary{background:var(--brass);border-color:var(--brass);color:#1b1610}
.btn.ghost{background:none}
.songlist{display:flex;flex-direction:column;gap:2px}
.songrow{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:9px;text-align:left;width:100%}
.songrow:hover{background:var(--panel2)}
.songrow.cur{background:var(--panel2);box-shadow:inset 3px 0 0 var(--brass)}
.songrow .t{flex:1;min-width:0}
.songrow .t b{display:block;font:400 19px/1.2 var(--serif);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songrow .t small{color:var(--muted);font-size:12.5px}
.songrow .best{font-variant-numeric:tabular-nums;color:var(--brass);font-size:13px}
.songrow .del{width:30px;height:30px;border-radius:7px;color:var(--muted)}
.songrow .del:hover{background:#3a2229;color:var(--bad)}
.lvl{display:inline-flex;gap:2px;vertical-align:middle;margin-left:2px}
.lvl i{width:6px;height:10px;border-radius:2px;background:#3a3445}
.lvl i.f{background:var(--brass)}
.drop{border:1.5px dashed #4a4357;border-radius:12px;padding:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.drop.hot{border-color:var(--brass);background:rgba(217,179,108,.07)}
.drop p{margin:0;flex:1;min-width:200px}
.row{display:flex;align-items:center;gap:14px;padding:7px 0}
.row .lb{flex:1;min-width:0}
.row .lb div:first-child{font-weight:500}
.row .hint{color:var(--muted);font-size:12.5px;white-space:normal}
.ctl{display:flex;align-items:center;gap:8px;flex-shrink:0}
.ctl input[type=range]{width:140px;accent-color:var(--brass)}
.rv{min-width:44px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.tog{position:relative;width:42px;height:24px;display:inline-block}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog span{position:absolute;inset:0;border-radius:99px;background:#3a3445;transition:background .15s;cursor:pointer}
.tog span::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--ivory);transition:transform .15s}
.tog input:checked+span{background:var(--brass)}
.tog input:checked+span::after{transform:translateX(18px)}
.tog input:focus-visible+span{outline:2px solid var(--brass);outline-offset:2px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px}
.step button{padding:4px 10px;font-weight:600}
.step span{min-width:40px;text-align:center;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;color:var(--muted);font-size:13px}
.keys kbd{font:600 12px var(--sans);color:var(--text);background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;white-space:nowrap}
.trk{display:flex;align-items:center;gap:10px;padding:6px 0}
.trk .nm{flex:1;min-width:0}
.trk .nm div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trk .nm small{color:var(--muted)}
.res-stars{display:flex;gap:6px;font-size:30px;color:#3a3445;margin:2px 0 12px}
.res-stars .f{color:var(--brass)}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.res-grid div{background:var(--lacquer);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.res-grid b{display:block;font:400 30px/1.1 var(--serif);color:var(--text)}
.res-grid small{color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.speed{flex-shrink:0}
.short{display:none}
@media (max-width:1060px){
  .long{display:none} .short{display:inline}
  .pill span{display:none} .pill{padding:8px}
  .tbtn span{display:none} .tbtn{padding:0 8px}
  .song{min-width:120px} .song-t{font-size:21px}
  .top{gap:7px;padding:6px 8px} .trans{padding:5px 8px;gap:3px} .barinfo{min-width:0}
}
@media (max-width:600px){
  .top{flex-wrap:wrap;row-gap:6px}
  .song{flex:1 1 0;max-width:none}
  .ctrls{order:5;width:100%;overflow-x:auto;scrollbar-width:none}
  .ctrls::-webkit-scrollbar{display:none}
  .spacer{display:none}
  .trans{flex-wrap:wrap;row-gap:2px}
  .tl{order:9;flex:1 1 calc(100% - 120px);margin:0 6px 0 2px}
  .barinfo{order:10}
}
@media (max-height:460px){ .top{padding:4px 8px} .trans{padding:3px 8px} .tbtn,.ico{height:32px} .play{height:34px} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="song" id="btnLib" title="Choose a song">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>
      <span class="song-t" id="songTitle">Choose a song</span>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="ctrls">
      <div class="seg" id="segMode" role="group" aria-label="Mode">
        <button data-v="wait" title="Notes wait at the red line until you play them">Learn</button>
        <button data-v="play" title="Keep time with the music; the notes keep moving"><span class="long">Play along</span><span class="short">Play</span></button>
        <button data-v="watch" title="Listen and watch the song played for you">Watch</button>
      </div>
      <div class="seg" id="segHands" role="group" aria-label="Hands">
        <button data-v="L" title="Practice the left hand (teal)"><span class="long">Left</span><span class="short">L</span></button>
        <button data-v="both" title="Practice both hands">Both</button>
        <button data-v="R" title="Practice the right hand (amber)"><span class="long">Right</span><span class="short">R</span></button>
      </div>
      <select id="selLevel" aria-label="Difficulty" title="Difficulty">
        <option value="1">Beginner</option>
        <option value="2">Easy</option>
        <option value="3">Intermediate</option>
        <option value="4">Advanced</option>
        <option value="5">Full piece</option>
      </select>
    </div>
    <div class="spacer"></div>
    <button class="pill" id="midiPill" title="Keyboard connection"><i class="dot"></i><span>No keyboard</span></button>
    <button class="ico" id="btnFull" aria-label="Full screen" title="Full screen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ico" id="btnSet" aria-label="Settings" title="Settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
  </header>

  <div class="trans">
    <button class="tbtn" id="bRestart" title="Back to the start (Home)"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h2.5v14H5zM19.5 5v14L9 12z"/></svg></button>
    <button class="tbtn" id="bBackNote" title="Back one note (Backspace or Shift+←)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Note</span></button>
    <button class="tbtn" id="bBackBar" title="Back one bar (←)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m11 6-6 6 6 6M19 6l-6 6 6 6"/></svg><span>Bar</span></button>
    <button class="play" id="bPlay" title="Play / pause (Space)"><svg id="playIco" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
    <button class="tbtn" id="bFwdBar" title="Forward one bar (→)"><span>Bar</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 6 6 6-6 6M13 6l6 6-6 6"/></svg></button>
    <div class="tl" id="tl" title="Tap or drag to jump anywhere"><div class="tl-track"><div class="tl-loop" id="tlLoop"></div><div class="tl-fill" id="tlFill"></div></div><div class="tl-head" id="tlHead"></div></div>
    <span class="barinfo" id="barInfo">Bar –</span>
    <div class="speed" role="group" aria-label="Speed">
      <button id="spdDn" aria-label="Slower" title="Slower">−</button>
      <button id="spdVal" title="Speed — tap to reset to 100%">100%</button>
      <button id="spdUp" aria-label="Faster" title="Faster">+</button>
    </div>
    <button class="tbtn loop" id="bLoop" title="Repeat a section: tap at the first bar, then at the last bar"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="m7 22-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg><span id="loopTxt">Loop</span></button>
  </div>

  <main class="stage" id="stage">
    <canvas id="cv" aria-label="Falling notes and piano keyboard"></canvas>
    <div class="toast" id="toast" role="status"></div>
  </main>
</div>

<!-- Library -->
<div class="modal" id="mLib"><div class="sheet">
  <div class="sheet-h"><h2>Songs</h2><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="sheet-b" id="libBody"></div>
</div></div>

<!-- Settings -->
<div class="modal" id="mSet"><div class="sheet">
  <div class="sheet-h"><h2>Settings</h2><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="sheet-b" id="setBody"></div>
</div></div>

<!-- Results -->
<div class="modal" id="mRes"><div class="sheet small">
  <div class="sheet-h"><h2 id="resTitle">Nicely done</h2><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="sheet-b" id="resBody"></div>
</div></div>

<input type="file" id="fileIn" accept=".mid,.midi,.kar,.rmi,audio/midi,audio/x-midi" multiple hidden>

<script>
'use strict';
/* =====================================================================
   Keyfall — a local falling-notes piano trainer. One file, no installs.
   ===================================================================== */

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const BLACK = [0,1,0,1,0,0,1,0,1,0,1,0];
const isBlack = m => BLACK[((m % 12) + 12) % 12] === 1;
const LETTERS = ['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'];
const SOLF = ['Do','Do♯','Ré','Ré♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function noteName(m, oct = true) {
  const pc = ((m % 12) + 12) % 12, o = Math.floor(m / 12) - 1;
  const n = (settings.names === 'solfege' ? SOLF : LETTERS)[pc];
  return oct ? n + o : n;
}
function nameToMidi(s) {
  const r = /^([A-G])([#b]?)(-?\d)$/.exec(s);
  if (!r) throw new Error('Bad note ' + s);
  return 12 * (+r[3] + 1) + {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[r[1]] + (r[2] === '#' ? 1 : r[2] === 'b' ? -1 : 0);
}
function lowerBound(arr, t, key = 't') { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid][key] < t) lo = mid + 1; else hi = mid; } return lo; }
function lowerBoundN(arr, t) { let lo = 0, hi = arr.length; while (lo < hi) { const mid = (lo + hi) >> 1; if (arr[mid] < t) lo = mid + 1; else hi = mid; } return lo; }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let toastTimer = 0;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), ms); }

// ---------- settings ----------
const DEF = { names:'letters', keyLabels:'c', pcLabels:false, showOther:true, look:3, range:'auto', anyOct:false,
  mySound:true, accomp:true, accVol:0.7, vol:0.85, metro:false, midiIn:'all', pcBase:48, listen:'auto', micSens:'normal',
  mode:'wait', hands:'both', level:2, speed:0.8, lastSong:'b:twinkle' };
const settings = Object.assign({}, DEF, store.get('kf_settings', {}));
function saveSettings() { store.set('kf_settings', settings); }
const LEVELS = {
  1: 'Beginner: right hand plays the melody only, left hand one bass note per beat.',
  2: 'Easy: one note at a time in each hand — chords are thinned out.',
  3: 'Intermediate: up to two notes at a time in each hand.',
  4: 'Advanced: up to three notes at a time in each hand.',
  5: 'Full piece: every note as written.'
};
const LEVEL_NAMES = {1:'Beginner',2:'Easy',3:'Intermediate',4:'Advanced',5:'Full piece'};

// =====================================================================
//  Audio: a small synthesized piano (no samples needed, works offline)
// =====================================================================
const Synth = (() => {
  let ctx = null, master, wave, noiseBuf, dry;
  const voices = new Map();
  let sustain = false; const held = new Set();
  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return ctx; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createGain(); master.gain.value = settings.vol;
    const comp = ctx.createDynamicsCompressor();
